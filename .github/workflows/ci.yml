name: Build and Test
on:
  push:
  pull_request:
  workflow_dispatch:
  schedule:
    - cron: '0 6 * * 1'  # Each Monday at 06:00 UTC

jobs:
  build:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04]
        java-version: ['21']

    steps:
    - uses: actions/checkout@v4
    - name: Diagnostic filesystem layout
      run: |
        set -x
        cat /etc/os-release | head -3
        df -T /tmp "$HOME" /home/runner/work || true
        findmnt -T /tmp || true
        findmnt -T "$HOME" || true
        java -XshowSettings:properties -version 2>&1 | grep -E "java.io.tmpdir|user.home"
    - uses: actions/setup-java@v3
      with:
        distribution: 'temurin'
        java-version: ${{ matrix.java-version }}
    - run: gradle build --info
    - run: gradle -PTestLoggingFull=true check_translation check
