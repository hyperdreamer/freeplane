      produces: [iface-screen-fill-surface, iface-presentation-chrome, iface-presentation-viewport, iface-presentation-hint]
      consumes: []
    validation:
      - argv: ["gradle", ":freeplane_plugin_graph:test", "--tests", "org.freeplane.plugin.graph.window.GraphPresentationModeShould", "-PTestLoggingFull", "--console=plain"]
