tasks.register('freeplaneLaunchSmoke', JavaExec) {
    dependsOn tasks.named('graphSmokeInstallation')
    dependsOn tasks.named('testClasses')
    classpath = sourceSets.test.runtimeClasspath
    mainClass = 'org.freeplane.plugin.graph.smoke.FreeplaneLaunchSmoke'
    workingDir rootDir
